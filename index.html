<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter from my heart</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12030a; --bg2:#3a0716; --wine:#8c1235; --rose:#c4204f; --deep:#5e0b24;
  --gold:#e6c27a; --paper:#fbf6f0; --ink:#3b1520; --muted:#a58a92;
  --script:'Great Vibes','Snell Roundhand',cursive;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12030a;--bg2:#3a0716}}
:root[data-theme="dark"]{--bg:#12030a;--bg2:#3a0716}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,var(--bg2),var(--bg) 70%);
  background-color:var(--bg);font-family:var(--serif);color:var(--paper);display:grid;place-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-6vh;background:var(--rose);opacity:.55;border-radius:60% 0 60% 0;
  animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}

main{position:relative;width:min(88vw,380px);text-align:center;z-index:1}
h1{font-family:var(--script);font-weight:400;font-size:clamp(2.2rem,9vw,3rem);color:var(--gold);margin:0;line-height:1.1}
.sub{letter-spacing:.28em;font-size:.68rem;color:var(--muted);margin:.4rem 0 2.2rem;text-transform:uppercase}
.hint{margin-top:1.8rem;font-style:italic;color:var(--muted);font-size:.95rem;transition:opacity .4s}

/* envelope */
.env{position:relative;width:100%;aspect-ratio:1.5;perspective:900px}
.env .body{position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,var(--wine),var(--deep));
  box-shadow:0 20px 50px #000a,inset 0 0 0 1px #ffffff14}
.env .body::before,.env .body::after{content:"";position:absolute;inset:0;border-radius:6px}
.env .body::before{background:linear-gradient(to bottom right,transparent 49.6%,#00000040 50%,transparent 50.4%) left/50% 100% no-repeat,
  linear-gradient(to bottom left,transparent 49.6%,#00000040 50%,transparent 50.4%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:top;z-index:3;
  background:linear-gradient(180deg,#a31640,var(--wine));clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .8s cubic-bezier(.5,0,.2,1)}
.env.open .flap{transform:rotateX(180deg);z-index:0;filter:brightness(.7)}
.seal{position:absolute;left:50%;top:54%;width:56px;height:56px;margin:-28px;border:0;border-radius:50%;z-index:4;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#ef4e7b,var(--rose) 55%,#8a1034);color:#fff;font-size:1.5rem;
  box-shadow:0 4px 14px #000a,0 0 0 6px #c4204f33;animation:beat 1.6s ease-in-out infinite;transition:opacity .4s}
.env.open .seal{opacity:0;pointer-events:none;animation:none}
@keyframes beat{50%{transform:scale(1.1);box-shadow:0 4px 14px #000a,0 0 0 12px #c4204f1f}}
.seal:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.opened .hint{opacity:0}

/* letter */
.letter{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:5;pointer-events:none;opacity:0;transition:opacity .35s}
.letter.show{opacity:1;pointer-events:auto}
.card{position:relative;width:min(94vw,420px);background:var(--paper);color:var(--ink);border-radius:10px;
  box-shadow:0 30px 70px #000c;transform:translateY(60px) scale(.94);transition:transform .6s cubic-bezier(.2,.9,.3,1.1)}
.show .card{transform:none}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #3b152018;
  font-size:.66rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.head .x{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:4px 8px}
.page{height:clamp(220px,42dvh,300px);overflow:auto;padding:18px 20px 8px;border-left:3px solid transparent;
  font-size:1.08rem;line-height:1.6;transition:opacity .25s}
.page.out{opacity:0}
.page h2{font-family:var(--script);font-weight:400;font-size:2.1rem;color:var(--deep);margin:0 0 .4rem}
.page p{margin:0 0 .8em}
.sign{display:flex;justify-content:space-between;align-items:end;margin-top:1rem;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.sign b{font:400 2rem/1 var(--script);letter-spacing:0;color:var(--rose);text-transform:none}
.foot{display:flex;gap:8px;justify-content:center;padding:12px 14px 16px;border-top:1px solid #3b152018}
.foot button{font:600 .9rem var(--serif);border-radius:20px;padding:8px 16px;cursor:pointer;border:1px solid #3b152030;background:#fff;color:var(--ink)}
.foot .next{background:var(--wine);border-color:var(--wine);color:#fff}
.foot button:disabled{opacity:.35;cursor:default}

/* polaroid + memories */
.pola{position:absolute;right:-8px;bottom:-62px;width:84px;padding:6px 6px 16px;background:#fff;border:0;border-radius:3px;
  transform:rotate(7deg);box-shadow:0 8px 20px #0009;cursor:pointer;color:var(--ink);font:italic .6rem var(--serif);transition:transform .25s}
.pola:hover{transform:rotate(3deg) scale(1.05)}
.ph{display:block;width:100%;aspect-ratio:1;border-radius:2px;background-size:cover;background-position:center}
.memories{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#000a;opacity:0;pointer-events:none;transition:opacity .3s}
.memories.show{opacity:1;pointer-events:auto}
.strip{width:min(70vw,230px);max-height:86dvh;overflow:auto;background:#f4ead9;padding:12px 12px 4px;border-radius:4px;
  box-shadow:0 20px 60px #000;transform:translateY(40px);transition:transform .5s cubic-bezier(.2,.9,.3,1.1)}
.memories.show .strip{transform:none}
.strip h3{margin:0 0 10px;text-align:center;font-size:.68rem;letter-spacing:.24em;color:var(--wine);text-transform:uppercase}
.strip figure{margin:0 0 12px;text-align:center;color:var(--ink);font-style:italic;font-size:.85rem}
.strip figure .ph{aspect-ratio:4/5;margin-bottom:4px}
.strip .close{display:block;margin:0 auto 12px;border:0;background:none;color:var(--wine);font:600 .85rem var(--serif);cursor:pointer}

@media (min-width:700px){.card{width:440px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="petals" aria-hidden="true"></div>

<main id="main">
  <h1 id="title">A Birthday letter from my heart</h1>
  <p class="sub">Written just for you</p>
  <div class="env" id="env">
    <div class="body"></div>
    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open the letter">&#10084;</button>
  </div>
  <p class="hint">Tap the seal to open</p>
</main>

<section class="letter" id="letter" aria-label="Letter">
  <div class="card">
    <div class="head"><span id="pn">Page 1 of 3</span><button class="x" id="x" aria-label="Close letter">&times;</button></div>
    <div class="page" id="page" tabindex="0"></div>
    <div class="foot">
      <button id="prev">&larr; Previous</button>
      <button id="close">Close</button>
      <button id="next" class="next">Next page &rarr;</button>
    </div>
    <button class="pola" id="pola" aria-label="Open our memories"><span class="ph" id="polaPh"></span>forever &amp; always</button>
  </div>
</section>

<section class="memories" id="mem" aria-label="Our memories">
  <div class="strip">
    <h3>Photos of Mizarla</h3>
    <div id="figs"></div>
    <button class="close" id="memClose">Close</button>
  </div>
</section>

<script>
/* ---- EDIT HERE: your words and photos ---- */
const CONFIG = {
  pages: [
    `<h2>To Mizarla,</h2><p>Happy birthday to you po. I know you we're having Birthday Blues right now, ug sorry because I wasn't there to Cheer you up, wala mn pd koy rights haha, pero dont worry dle lagi na perme ing ana.</p><p>Someday ma feel ra nimo nga very special jd ni nimo nga adlaw without birthday blues.</p>`,
    `<p>Anyways, Wish lng nako para sa imo is magmalipayon ka, stay healthy ug remain Beautiful gyapon hehe.</p><p>Wishing na ma successful ka and ma achieve nimo ang mga gipangandoy nimo specially the life you wanted and those plans nga imong gina share sa akoa.</p>`,
    `<p>Although mas nag ila rata within 1 month lng, know that I'm rooting for you, It's unfortunate that we met at the wrong time; I would have always made you feel special hayys😫. Since hindi pinalad maging Greatest love mo, sa Geatest Fan of your life nlng ko haha</p><p>Happy Birthday once again🎂🎉, May God Bless you always</p><div class="sign"><span>Your Greatest</span><b>Fan &#10084;</b></div>`
  ],
  /* Put image URLs (or data: URIs) in `img`. Empty = soft gradient placeholder. */
  photos: [
    { img:"m2.jfif", caption:"Stolen, pero Gwapa japon",  tint:["#f4a259","#5b2a44"] },
    { img:"m3.jfif", caption:"Cute",  tint:["#d98c5f","#2f1a1f"] },
    { img:"m1.jfif", caption:"Gwapaha jd oi",   tint:["#e56b8a","#2a2a52"] }
  ]
};
/* ------------------------------------------ */
const $=id=>document.getElementById(id);
let cur=0, busy=false;

// falling petals
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=$('petals');
  for(let i=0;i<26;i++){
    const p=document.createElement('span'), s=6+Math.random()*10;
    p.className='petal';
    p.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s*1.3}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*16}s;--dx:${(Math.random()*80-40)}px;--rot:${Math.random()*540}deg;opacity:${.25+Math.random()*.45}`;
    box.appendChild(p);
  }
})();

// photos
function bg(p){return p.img?`url("${p.img}")`:`linear-gradient(160deg,${p.tint[0]},${p.tint[1]})`}
$('polaPh').style.backgroundImage=bg(CONFIG.photos[2]);
$('figs').innerHTML=CONFIG.photos.map(p=>`<figure><span class="ph" style="background-image:${bg(p).replace(/"/g,'&quot;')}"></span>${p.caption}</figure>`).join('');

function render(){
  const n=CONFIG.pages.length;
  $('page').innerHTML=CONFIG.pages[cur];
  $('page').scrollTop=0;
  $('pn').textContent=`Page ${cur+1} of ${n}`;
  $('prev').disabled=cur===0;
  $('next').disabled=cur===n-1;
}
function go(d){
  const t=cur+d; if(busy||t<0||t>=CONFIG.pages.length) return;
  busy=true; $('page').classList.add('out');
  setTimeout(()=>{cur=t;render();$('page').classList.remove('out');busy=false},220);
}
function openLetter(){
  $('env').classList.add('open'); document.body.classList.add('opened');
  cur=0; render();
  setTimeout(()=>{$('letter').classList.add('show');$('page').focus({preventScroll:true})},650);
}
function closeLetter(){
  $('letter').classList.remove('show'); closeMem();
  setTimeout(()=>{$('env').classList.remove('open');document.body.classList.remove('opened');$('seal').focus({preventScroll:true})},350);
}
function closeMem(){$('mem').classList.remove('show')}

$('seal').onclick=openLetter;
$('next').onclick=()=>go(1);
$('prev').onclick=()=>go(-1);
$('close').onclick=$('x').onclick=closeLetter;
$('pola').onclick=()=>$('mem').classList.add('show');
$('memClose').onclick=closeMem;
$('mem').onclick=e=>{if(e.target===$('mem'))closeMem()};
addEventListener('keydown',e=>{
  if(e.key==='Escape') $('mem').classList.contains('show')?closeMem():closeLetter();
  if($('letter').classList.contains('show')){ if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); }
});
// swipe between pages
let sx=null;
$('page').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('page').addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(d<0?1:-1);sx=null});
</script>
</body>
</html>
